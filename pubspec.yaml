name: chat_app
description: A production-ready real-time chat messaging application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Auth
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  record: ^5.1.2
  just_audio: ^0.9.40

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  timeago: ^3.7.0
  shared_preferences: ^2.3.2
  flutter_svg: ^2.0.10+1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  shimmer: ^3.0.0
  emoji_picker_flutter: ^3.0.0
  photo_view: ^0.15.0
  file_picker: ^8.1.2
  rxdart: ^0.28.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  go_router: ^14.2.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
